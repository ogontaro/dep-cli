name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2 # .mise.tomlのbunバージョンをそのまま使う(ローカル開発と揃える)
      - run: bun install --frozen-lockfile
      - run: mise run typecheck
      - run: mise run test
      - run: mise run diagram && git diff --exit-status docs/ # .d2 と .svg のドリフト検出
