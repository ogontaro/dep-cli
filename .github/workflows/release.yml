name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: darwin-arm64
          - target: bun-darwin-x64
            asset: darwin-amd64
          - target: bun-linux-x64
            asset: linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/cli.ts --compile --target=${{ matrix.target }} --outfile depctl
      - run: tar -czf depctl-${{ matrix.asset }}.tar.gz depctl
      - uses: actions/upload-artifact@v4
        with:
          name: depctl-${{ matrix.asset }}
          path: depctl-${{ matrix.asset }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
