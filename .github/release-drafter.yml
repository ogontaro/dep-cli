name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: ['feat']
  - title: '🐛 Fixes'
    labels: ['fix']
  - title: '🧹 Chore'
    labels: ['chore', 'refactor', 'docs', 'style', 'test', 'perf']

change-template: '- $TITLE (#$NUMBER)'

version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['feat']
  patch:
    labels: ['fix', 'chore', 'docs', 'style', 'refactor', 'perf', 'test']
  default: patch

autolabeler:
  - label: 'feat'
    title: '/^feat/i'
  - label: 'fix'
    title: '/^fix/i'
  - label: 'chore'
    title: '/^chore/i'
  - label: 'docs'
    title: '/^docs/i'
  - label: 'style'
    title: '/^style/i'
  - label: 'refactor'
    title: '/^refactor/i'
  - label: 'perf'
    title: '/^perf/i'
  - label: 'test'
    title: '/^test/i'

template: |
  ## 変更内容

  $CHANGES
